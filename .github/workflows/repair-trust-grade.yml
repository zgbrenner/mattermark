name: Repair trust grade

on:
  push:
    branches: [feat/portable-evidence-preflight]
    paths:
      - .github/workflows/repair-trust-grade.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portable-evidence-preflight
      - name: Correct unconfirmed-anchor trust semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/evidence.ts')
          text = path.read_text()
          old = """  const externallyAnchored = anchorResults.some(\n    (anchor) =>\n      anchor.inclusionValid &&\n      anchor.proofStatus === 'ots-bitcoin-attestation-unconfirmed',\n  );\n  let trust: EvidenceVerificationResult['trust'] = 'invalid';\n  if (coreValid) {\n    if (keyPinned === true && externallyAnchored) trust = 'key-pinned-and-externally-anchored';\n    else if (keyPinned === true) trust = 'key-pinned';\n    else trust = 'self-contained';\n  }\n"""
          new = """  // A block-height attestation is useful evidence, but it is not an\n  // independently confirmed external timestamp until a trusted block header\n  // verifies the commitment. Do not upgrade the trust grade merely because\n  // an unconfirmed attestation is present.\n  let trust: EvidenceVerificationResult['trust'] = 'invalid';\n  if (coreValid) {\n    if (keyPinned === true) trust = 'key-pinned';\n    else trust = 'self-contained';\n  }\n"""
          if old not in text:
              raise SystemExit('target trust block not found')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/repair-trust-grade.yml').unlink()
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/evidence.ts .github/workflows/repair-trust-grade.yml
          git commit -m 'fix: do not promote unconfirmed timestamp attestations'
          git push origin HEAD:feat/portable-evidence-preflight
