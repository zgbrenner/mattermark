name: Repair canonical evidence validation

on:
  push:
    branches: [feat/portable-evidence-preflight]
    paths:
      - .github/workflows/repair-canonical-evidence.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portable-evidence-preflight
      - name: Harden v1 envelope validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/evidence.ts')
          text = path.read_text()
          text = text.replace(
            """  if (!Array.isArray(envelope.signatures) || envelope.signatures.length === 0) {\n    throw new Error('envelope.signatures must contain at least one signature');\n  }\n""",
            """  if (!Array.isArray(envelope.signatures) || envelope.signatures.length !== 1) {\n    throw new Error('version 1 envelope.signatures must contain exactly one signature');\n  }\n""",
          )
          old = """  let statementRaw: unknown;\n  try {\n    statementRaw = JSON.parse(payload.toString('utf8'));\n  } catch {\n"""
          new = """  let statementRaw: unknown;\n  try {\n    statementRaw = JSON.parse(payload.toString('utf8'));\n    if (stableStringify(statementRaw) !== payload.toString('utf8')) {\n      errors.push('signed evidence payload must use the canonical JSON encoding');\n    }\n  } catch {\n"""
          if old not in text:
              raise SystemExit('canonical payload target not found')
          text = text.replace(old, new)
          path.write_text(text)
          Path('.github/workflows/repair-canonical-evidence.yml').unlink()
          PY
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/evidence.ts .github/workflows/repair-canonical-evidence.yml
          git commit -m 'fix: require canonical single-signature evidence envelopes'
          git push origin HEAD:feat/portable-evidence-preflight
