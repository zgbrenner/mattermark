name: Repair final strictness

on:
  push:
    branches: [feat/portable-evidence-preflight]
    paths:
      - .github/workflows/repair-final-strictness.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portable-evidence-preflight
      - name: Apply verifier and timestamp fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          evidence = Path('src/evidence.ts')
          text = evidence.read_text()

          old_signatures = """  if (!Array.isArray(envelope.signatures) || envelope.signatures.length === 0) {
    throw new Error('envelope.signatures must contain at least one signature');
  }
"""
          new_signatures = """  if (!Array.isArray(envelope.signatures) || envelope.signatures.length !== 1) {
    throw new Error('Mattermark evidence v1 requires exactly one signature');
  }
"""
          if old_signatures not in text:
              raise SystemExit('signature cardinality block not found')
          text = text.replace(old_signatures, new_signatures)

          old_parse = """  let statementRaw: unknown;
  try {
    statementRaw = JSON.parse(payload.toString('utf8'));
  } catch {
    errors.push('signed payload is not valid JSON');
    const result = invalidResult(errors, warnings, keyid);
    result.signatureValid = signatureValid;
    result.keyPinned = keyPinned;
    return result;
  }

  let statementValid = true;
"""
          new_parse = """  let statementRaw: unknown;
  let canonicalPayload = true;
  try {
    const payloadText = payload.toString('utf8');
    statementRaw = JSON.parse(payloadText);
    canonicalPayload = payloadText === stableStringify(statementRaw);
    if (!canonicalPayload) {
      errors.push('signed statement payload is not canonical Mattermark JSON');
    }
  } catch {
    errors.push('signed payload is not valid JSON');
    const result = invalidResult(errors, warnings, keyid);
    result.signatureValid = signatureValid;
    result.keyPinned = keyPinned;
    return result;
  }

  let statementValid = canonicalPayload;
"""
          if old_parse not in text:
              raise SystemExit('statement parse block not found')
          evidence.write_text(text.replace(old_parse, new_parse))

          ots = Path('src/ledger/opentimestamps.ts')
          ots_text = ots.read_text()
          old_confirmed = """        confirmed: summary.bitcoin.length > 0,
        bitcoinAttestation: summary.bitcoin.length > 0,
"""
          new_confirmed = """        // Retained for serialized compatibility. A Bitcoin attestation is not
        // independently confirmed until checked against a trusted block header.
        confirmed: false,
        bitcoinAttestation: summary.bitcoin.length > 0,
"""
          if old_confirmed not in ots_text:
              raise SystemExit('legacy confirmed metadata block not found')
          ots.write_text(ots_text.replace(old_confirmed, new_confirmed))

          Path('.github/workflows/repair-final-strictness.yml').unlink()
          PY
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/evidence.ts src/ledger/opentimestamps.ts .github/workflows/repair-final-strictness.yml
          git commit -m 'fix: enforce canonical single-signature evidence envelopes'
          git push origin HEAD:feat/portable-evidence-preflight
