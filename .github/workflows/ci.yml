name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# TDD produces many small commits. Keep only the newest run for a branch so
# obsolete matrices do not consume minutes or leave the actual head waiting.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: node --import tsx --test test/*.test.ts

      - name: Survival harness
        run: npm run demo

      - name: Survival matrix
        run: npm run matrix

      - name: Document pipeline
        run: npm run docx-demo

      - name: Registry pipeline
        run: npm run ledger-demo

      - name: Anchor pipeline
        run: npm run anchor-demo

      - name: Build package
        run: npm run build

      - name: Inspect package tarball
        run: npm pack --dry-run
