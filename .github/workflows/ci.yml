name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  compatibility:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Run compiled CLI smoke test
        run: node dist/bin.js help

  validate:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: node --import tsx --test test/*.test.ts

      - name: Survival harness
        run: npm run demo

      - name: Survival matrix
        run: npm run matrix

      - name: Document pipeline
        run: npm run docx-demo

      - name: Registry pipeline
        run: npm run ledger-demo

      - name: Anchor pipeline
        run: npm run anchor-demo

      - name: Build package
        run: npm run build

      - name: Inspect package tarball
        run: npm pack --dry-run

      - name: Upload compiled package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: mattermark-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
