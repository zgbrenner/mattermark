name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unit + integration tests: framing, crypto, codecs, composition guard,
      # transforms, registry, portable evidence, artifact verification,
      # preflight, CLI behavior, packaging, and the real corpus loader.
      - name: Tests
        run: node --import tsx --test test/*.test.ts

      - name: Survival harness (demo)
        run: npm run demo

      - name: Survival matrix (corpus)
        run: npm run matrix

      - name: Document pipeline (demo)
        run: npm run docx-demo

      - name: Registry pipeline (demo)
        run: npm run ledger-demo

      - name: External anchor pipeline (demo)
        run: npm run anchor-demo

      - name: Build package
        run: npm run build

      - name: Inspect package tarball
        if: matrix.node == '20'
        run: npm pack --dry-run
