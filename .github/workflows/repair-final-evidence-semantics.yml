name: Repair final evidence semantics

on:
  push:
    branches: [feat/portable-evidence-preflight]
    paths:
      - .github/workflows/repair-final-evidence-semantics.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portable-evidence-preflight
      - name: Correct validity and timestamp metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          evidence = Path('src/evidence.ts')
          text = evidence.read_text()
          old = """    currentLedgerProofValid &&\n    (keyPinned !== false);\n"""
          new = """    currentLedgerProofValid &&\n    (keyPinned !== false) &&\n    errors.length === 0;\n"""
          if old not in text:
              raise SystemExit('evidence validity target not found')
          evidence.write_text(text.replace(old, new))

          ots = Path('src/ledger/opentimestamps.ts')
          text = ots.read_text()
          old = """        // Backward-compatible field retained for old readers. It means only\n        // that a Bitcoin attestation is present, not header-confirmed validity.\n        confirmed: bitcoinAttestation,\n"""
          new = """        // Backward-compatible field retained for old readers. It remains false\n        // until a trusted block-header verification result can support it.\n        confirmed: false,\n"""
          if old not in text:
              raise SystemExit('OpenTimestamps metadata target not found')
          ots.write_text(text.replace(old, new))

          Path('.github/workflows/repair-final-evidence-semantics.yml').unlink()
          PY
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/evidence.ts src/ledger/opentimestamps.ts .github/workflows/repair-final-evidence-semantics.yml
          git commit -m 'fix: enforce final evidence and timestamp semantics'
          git push origin HEAD:feat/portable-evidence-preflight
