name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${GITHUB_REF_NAME}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Tag $actual does not match package version $expected" >&2
            exit 1
          fi

      - name: Full validation
        run: npm test

      - name: Run product pipelines
        run: |
          npm run demo
          npm run matrix
          npm run docx-demo
          npm run ledger-demo
          npm run anchor-demo

      - name: Build
        run: npm run build

      - name: Pack release tarball
        id: pack
        run: |
          package_file=$(npm pack --json | node -e "let s=''; process.stdin.on('data',d=>s+=d); process.stdin.on('end',()=>console.log(JSON.parse(s)[0].filename))")
          sha256sum "$package_file" > "$package_file.sha256"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mattermark-${{ github.ref_name }}
          path: |
            ${{ steps.pack.outputs.package_file }}
            ${{ steps.pack.outputs.package_file }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${{ steps.pack.outputs.package_file }}" \
              "${{ steps.pack.outputs.package_file }}.sha256" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${{ steps.pack.outputs.package_file }}" \
              "${{ steps.pack.outputs.package_file }}.sha256" \
              --generate-notes \
              --verify-tag
          fi
